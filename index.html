<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAEA</title>
  <link rel="icon" type="image/png" href="Assets/CAEA-Navbar-Logo.png" />
  <link rel="apple-touch-icon" href="Assets/CAEA-Navbar-Logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Header / Navbar Section -->
  <header class="site-header">
    <nav class="navbar" aria-label="Main Navigation">
      <!-- 1st Column: Logo -->
      <div class="nav-col nav-col-start">
        <a href="#" class="brand-link">
          <img src="Assets/CAEA-Navbar-Logo.png" alt="CAEA Logo" class="brand-logo" />
        </a>
      </div>

      <!-- Navigation buttons -->
      <div class="nav-col nav-col-center">
        <ul class="nav-content">
          <li><a href="#our-stories" class="nav-item">Our Stories</a></li>
          <li><a href="#our-work" class="nav-item">Our Work</a></li>
          <li><a href="#get-involved" class="nav-item">Get Involved</a></li>
        </ul>
      </div>

      <!-- Top Right: CD -->
      <div class="nav-col nav-col-end">
        <span class="nav-cd">CD</span>
      </div>
    </nav>
  </header>

  <!-- Hero Section -->
  <main>
    <section class="hero-section">
      <div class="hero-wrapper">
        <div class="hero-image-container">
          <img 
            src="Assets/Hero-image.png" 
            alt="CAEA Hero" 
            class="hero-image" 
            fetchpriority="high"
          />
        </div>
        <div class="hero-text-container">
          <h1 class="hero-quote">
            Not only must we be good, but we<br />must also be good for something.
          </h1>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
